name: Actualizar RSS completa de MarketScreener

on:
  workflow_dispatch:

  schedule:
    # GitHub ejecuta el cron en UTC.
    # El programa comprueba después la hora española.
    - cron: "8 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: actualizar-rss-marketscreener-completo
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar horario de España
        id: horario
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          ahora = datetime.now(
              ZoneInfo("Europe/Madrid")
          )

          evento = os.environ.get(
              "EVENTO",
              ""
          )

          if evento == "workflow_dispatch":
              permitido = True
              print(
                  "Ejecución manual permitida."
              )
          else:
              permitido = (
                  ahora.weekday() <= 4
                  and 7 <= ahora.hour <= 22
              )

          print(
              "Hora española:",
              ahora.strftime(
                  "%Y-%m-%d %H:%M:%S"
              )
          )

          print(
              "Ejecución permitida:",
              permitido
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as archivo:
              archivo.write(
                  "ejecutar="
                  + (
                      "true"
                      if permitido
                      else "false"
                  )
                  + "\n"
              )
          PY

      - name: Instalar dependencias
        if: steps.horario.outputs.ejecutar == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Crear RSS
        if: steps.horario.outputs.ejecutar == 'true'
        run: python actualizar_rss.py

      - name: Guardar RSS actualizada
        if: steps.horario.outputs.ejecutar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add rss.xml estado.json

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Actualizar RSS completa de MarketScreener"
            git push
          fi
